
name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas
        run: brew install ldid make dpkg xz

      - name: Theos e SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks

      - name: Verificar arquivos
        run: |
          echo "Arquivos disponíveis:"
          find . -maxdepth 3 -type f

          if [ ! -f "projectantigo_sem_links.zip" ]; then
            echo "ERRO: Arquivo ZIP não encontrado!"
            exit 1
          fi
          
      
      - name: Compilar
        run: |
          export THEOS=$HOME/theos

          unzip -o projectantigo_sem_links.zip

          # Verificar nome da pasta
          if [ -d "ARIYAN IOS" ]; then
            mv "ARIYAN IOS" ARIYAN_IOS
          fi

          if [ ! -d "ARIYAN_IOS" ]; then
            echo "ERRO: Pasta ARIYAN_IOS não encontrada!"
            exit 1
          fi

          cd ARIYAN_IOS

          # Corrigir caminho do Theos
          sed -i '' 's#/var/theos/makefiles/common.mk#$(THEOS)/makefiles/common.mk#' Makefile

          # Compilar
          gmake clean package

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: "ARIYAN_IOS/packages/*.deb"
          
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: "ARIYAN_IOS/packages/*.deb"


      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: "ARIYAN IOS/packages/*.deb"
